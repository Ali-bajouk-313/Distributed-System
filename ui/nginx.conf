server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2g;
    location /api/ {
        proxy_pass http://loadbalancer/;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
