    {
      "apiVersion": "v1",
      "kind": "ConfigMap",
      "metadata": {
        "name": "grafana-config",
        "namespace": "atlas"
      },
      "data": {
        "datasource.yml": "apiVersion: 1\ndatasources:\n  - name: Prometheus\n    uid: prometheus\n    type: prometheus\n    access: proxy\n    url: http://prometheus:9090\n    isDefault: true\n",
        "provider.yml": "apiVersion: 1\nproviders:\n  - name: Atlas\n    type: file\n    options:\n      path: /var/lib/grafana/dashboards\n",
        "storage.json": "{\n  \"uid\": \"atlas-storage\",\n  \"title\": \"Atlas Distributed Storage\",\n  \"schemaVersion\": 39,\n  \"version\": 1,\n  \"refresh\": \"5s\",\n  \"time\": {\n    \"from\": \"now-30m\",\n    \"to\": \"now\"\n  },\n  \"panels\": [\n    {\n      \"id\": 1,\n      \"title\": \"Request throughput\",\n      \"type\": \"timeseries\",\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 0,\n        \"w\": 12,\n        \"h\": 8\n      },\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"targets\": [\n        {\n          \"expr\": \"sum(rate(gateway_requests_total[1m]))\",\n          \"legendFormat\": \"{{node}}{{instance}}\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"reqps\"\n        },\n        \"overrides\": []\n      }\n    },\n    {\n      \"id\": 2,\n      \"title\": \"P95 gateway latency\",\n      \"type\": \"timeseries\",\n      \"gridPos\": {\n        \"x\": 12,\n        \"y\": 0,\n        \"w\": 12,\n        \"h\": 8\n      },\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"targets\": [\n        {\n          \"expr\": \"histogram_quantile(0.95, sum by (le) (rate(gateway_request_seconds_bucket[1m])))\",\n          \"legendFormat\": \"{{node}}{{instance}}\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"s\"\n        },\n        \"overrides\": []\n      }\n    },\n    {\n      \"id\": 3,\n      \"title\": \"Healthy storage nodes\",\n      \"type\": \"timeseries\",\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 8,\n        \"w\": 12,\n        \"h\": 8\n      },\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"targets\": [\n        {\n          \"expr\": \"cluster_healthy_nodes\",\n          \"legendFormat\": \"{{node}}{{instance}}\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\"\n        },\n        \"overrides\": []\n      }\n    },\n    {\n      \"id\": 4,\n      \"title\": \"Degraded objects\",\n      \"type\": \"timeseries\",\n      \"gridPos\": {\n        \"x\": 12,\n        \"y\": 8,\n        \"w\": 12,\n        \"h\": 8\n      },\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"targets\": [\n        {\n          \"expr\": \"cluster_degraded_objects\",\n          \"legendFormat\": \"{{node}}{{instance}}\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\"\n        },\n        \"overrides\": []\n      }\n    },\n    {\n      \"id\": 5,\n      \"title\": \"Storage bytes per node\",\n      \"type\": \"timeseries\",\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 16,\n        \"w\": 12,\n        \"h\": 8\n      },\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"targets\": [\n        {\n          \"expr\": \"storage_node_stored_bytes\",\n          \"legendFormat\": \"{{node}}{{instance}}\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"bytes\"\n        },\n        \"overrides\": []\n      }\n    },\n    {\n      \"id\": 6,\n      \"title\": \"Chunks per node\",\n      \"type\": \"timeseries\",\n      \"gridPos\": {\n        \"x\": 12,\n        \"y\": 16,\n        \"w\": 12,\n        \"h\": 8\n      },\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"targets\": [\n        {\n          \"expr\": \"storage_node_chunks\",\n          \"legendFormat\": \"{{node}}{{instance}}\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\"\n        },\n        \"overrides\": []\n      }\n    },\n    {\n      \"id\": 7,\n      \"title\": \"Free disk per node\",\n      \"type\": \"timeseries\",\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 24,\n        \"w\": 12,\n        \"h\": 8\n      },\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"targets\": [\n        {\n          \"expr\": \"storage_node_disk_free_bytes\",\n          \"legendFormat\": \"{{node}}{{instance}}\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"bytes\"\n        },\n        \"overrides\": []\n      }\n    },\n    {\n      \"id\": 8,\n      \"title\": \"Repair rate\",\n      \"type\": \"timeseries\",\n      \"gridPos\": {\n        \"x\": 12,\n        \"y\": 24,\n        \"w\": 12,\n        \"h\": 8\n      },\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"targets\": [\n        {\n          \"expr\": \"rate(cluster_repaired_fragments_total[2m])\",\n          \"legendFormat\": \"{{node}}{{instance}}\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"ops\"\n        },\n        \"overrides\": []\n      }\n    },\n    {\n      \"id\": 9,\n      \"title\": \"Recovery traffic\",\n      \"type\": \"timeseries\",\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 32,\n        \"w\": 12,\n        \"h\": 8\n      },\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"targets\": [\n        {\n          \"expr\": \"rate(cluster_repair_read_bytes_total[2m]) + rate(cluster_repair_write_bytes_total[2m])\",\n          \"legendFormat\": \"{{node}}{{instance}}\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"Bps\"\n        },\n        \"overrides\": []\n      }\n    },\n    {\n      \"id\": 10,\n      \"title\": \"Unavailable objects\",\n      \"type\": \"timeseries\",\n      \"gridPos\": {\n        \"x\": 12,\n        \"y\": 32,\n        \"w\": 12,\n        \"h\": 8\n      },\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"targets\": [\n        {\n          \"expr\": \"cluster_unavailable_objects\",\n          \"legendFormat\": \"{{node}}{{instance}}\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\"\n        },\n        \"overrides\": []\n      }\n    }\n  ],\n  \"tags\": [\n    \"distributed-systems\",\n    \"storage\"\n  ]\n}"
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "grafana",
        "namespace": "atlas"
      },
      "spec": {
        "replicas": 1,
        "selector": {
          "matchLabels": {
            "app": "grafana"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app": "grafana"
            }
          },
          "spec": {
            "containers": [
              {
                "name": "grafana",
                "image": "grafana/grafana:latest",
                "imagePullPolicy": "IfNotPresent",
                "ports": [
                  {
                    "containerPort": 3000
                  }
                ],
                "envFrom": [
                  {
                    "secretRef": {
                      "name": "atlas-secrets"
                    }
                  }
                ],
                "env": [
                  {
                    "name": "GF_SECURITY_ADMIN_USER",
                    "value": "admin"
                  },
                  {
                    "name": "GF_SECURITY_ADMIN_PASSWORD",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "atlas-secrets",
                        "key": "GRAFANA_PASSWORD"
                      }
                    }
                  }
                ],
                "volumeMounts": [
                  {
                    "name": "config",
                    "mountPath": "/etc/grafana/provisioning/datasources/datasource.yml",
                    "subPath": "datasource.yml"
                  },
                  {
                    "name": "config",
                    "mountPath": "/etc/grafana/provisioning/dashboards/provider.yml",
                    "subPath": "provider.yml"
                  },
                  {
                    "name": "config",
                    "mountPath": "/var/lib/grafana/dashboards/storage.json",
                    "subPath": "storage.json"
                  }
                ],
                "resources": {
                  "requests": {
                    "cpu": "50m",
                    "memory": "96Mi"
                  },
                  "limits": {
                    "cpu": "1000m",
                    "memory": "512Mi"
                  }
                }
              }
            ],
            "volumes": [
              {
                "name": "config",
                "configMap": {
                  "name": "grafana-config"
                }
              }
            ]
          }
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "grafana",
        "namespace": "atlas"
      },
      "spec": {
        "selector": {
          "app": "grafana"
        },
        "ports": [
          {
            "port": 3000,
            "targetPort": 3000,
            "name": "http"
          }
        ]
      }
    }
  ]
}
