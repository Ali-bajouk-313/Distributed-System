    {
      "apiVersion": "apps/v1",
      "kind": "StatefulSet",
      "metadata": {
        "name": "elasticsearch",
        "namespace": "atlas"
      },
      "spec": {
        "serviceName": "elasticsearch",
        "replicas": 1,
        "selector": {
          "matchLabels": {
            "app": "elasticsearch"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app": "elasticsearch"
            }
          },
          "spec": {
            "securityContext": {
              "fsGroup": 1000
            },
            "containers": [
              {
                "name": "elasticsearch",
                "image": "docker.elastic.co/elasticsearch/elasticsearch:8.15.0",
                "imagePullPolicy": "IfNotPresent",
                "ports": [
                  {
                    "containerPort": 9200
                  }
                ],
                "command": [
                  "/usr/share/elasticsearch/bin/elasticsearch"
                ],
                "args": [
                  "-Ediscovery.type=single-node",
                  "-Expack.security.enabled=false",
                  "-Expack.ml.enabled=false",
                  "-Enetwork.host=0.0.0.0"
                ],
                "envFrom": [
                  {
                    "secretRef": {
                      "name": "atlas-secrets"
                    }
                  }
                ],
                "env": [
                  {
                    "name": "discovery.type",
                    "value": "single-node"
                  },
                  {
                    "name": "xpack.security.enabled",
                    "value": "false"
                  },
                  {
                    "name": "xpack.ml.enabled",
                    "value": "false"
                  },
                  {
                    "name": "ES_JAVA_OPTS",
                    "value": "-Xms384m -Xmx384m"
                  }
                ],
                "volumeMounts": [
                  {
                    "name": "data",
                    "mountPath": "/usr/share/elasticsearch/data"
                  }
                ],
                "resources": {
                  "requests": {
                    "cpu": "100m",
                    "memory": "512Mi"
                  },
                  "limits": {
                    "cpu": "1500m",
                    "memory": "1536Mi"
                  }
                },
                "livenessProbe": {
                  "httpGet": {
                    "path": "/_cluster/health",
                    "port": 9200
                  },
                  "initialDelaySeconds": 60,
                  "periodSeconds": 10,
                  "timeoutSeconds": 5
                },
                "readinessProbe": {
                  "httpGet": {
                    "path": "/_cluster/health",
                    "port": 9200
                  },
                  "initialDelaySeconds": 20,
                  "periodSeconds": 10,
                  "timeoutSeconds": 5
                }
              }
            ]
          }
        },
        "volumeClaimTemplates": [
          {
            "metadata": {
              "name": "data"
            },
            "spec": {
              "accessModes": [
                "ReadWriteOnce"
              ],
              "resources": {
                "requests": {
                  "storage": "5Gi"
                }
              }
            }
          }
        ]
      }
