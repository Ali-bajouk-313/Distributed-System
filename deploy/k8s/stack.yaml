          },
          "spec": {
            "containers": [
              {
                "name": "rabbit",
                "image": "rabbitmq:4-management",
                "imagePullPolicy": "IfNotPresent",
                "ports": [
                  {
                    "containerPort": 5672
                  }
                ],
                "envFrom": [
                  {
                    "secretRef": {
                      "name": "atlas-secrets"
                    }
                  }
                ],
                "env": [
                  {
                    "name": "RABBITMQ_DEFAULT_USER",
                    "value": "storage"
                  },
                  {
                    "name": "RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS",
                    "value": "+S 2:2 +A 4"
                  },
                  {
                    "name": "RABBITMQ_CTL_ERL_ARGS",
                    "value": "+S 1:1 +A 1"
                  },
                  {
                    "name": "RABBITMQ_DEFAULT_PASS",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "atlas-secrets",
                        "key": "RABBIT_PASSWORD"
                      }
                    }
                  }
                ],
                "volumeMounts": [
                  {
                    "name": "data",
                    "mountPath": "/var/lib/rabbitmq"
                  }
                ],
                "resources": {
                  "requests": {
                    "cpu": "50m",
                    "memory": "96Mi"
                  },
                  "limits": {
                    "cpu": "1000m",
                    "memory": "512Mi"
                  }
                },
                "readinessProbe": {
                  "exec": {
                    "command": [
                      "rabbitmq-diagnostics",
                      "-q",
                      "ping"
                    ]
                  },
                  "initialDelaySeconds": 30,
                  "periodSeconds": 15,
                  "timeoutSeconds": 10
                },
                "livenessProbe": {
                  "exec": {
                    "command": [
                      "rabbitmq-diagnostics",
                      "-q",
                      "ping"
                    ]
                  },
                  "initialDelaySeconds": 30,
                  "periodSeconds": 15,
                  "timeoutSeconds": 10
                }
              }
            ]
          }
        },
        "volumeClaimTemplates": [
          {
            "metadata": {
              "name": "data"
            },
            "spec": {
              "accessModes": [
                "ReadWriteOnce"
              ],
              "resources": {
                "requests": {
                  "storage": "2Gi"
                }
              }
            }
          }
        ]
      }
