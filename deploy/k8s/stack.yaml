            "list",
            "watch"
          ]
        }
      ]
    },
    {
      "apiVersion": "rbac.authorization.k8s.io/v1",
      "kind": "RoleBinding",
      "metadata": {
        "name": "prometheus",
        "namespace": "atlas"
      },
      "subjects": [
        {
          "kind": "ServiceAccount",
          "name": "prometheus"
        }
      ],
      "roleRef": {
        "kind": "Role",
        "name": "prometheus",
        "apiGroup": "rbac.authorization.k8s.io"
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "prometheus",
        "namespace": "atlas"
      },
      "spec": {
        "replicas": 1,
        "selector": {
          "matchLabels": {
            "app": "prometheus"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app": "prometheus"
            }
          },
          "spec": {
            "containers": [
              {
                "name": "prometheus",
                "image": "prom/prometheus:latest",
                "imagePullPolicy": "IfNotPresent",
                "ports": [
                  {
                    "containerPort": 9090
                  }
                ],
                "volumeMounts": [
                  {
                    "name": "config",
                    "mountPath": "/etc/prometheus/prometheus.yml",
                    "subPath": "prometheus.yml"
                  }
                ],
                "resources": {
                  "requests": {
                    "cpu": "50m",
                    "memory": "96Mi"
                  },
                  "limits": {
                    "cpu": "1000m",
                    "memory": "512Mi"
                  }
                }
              }
            ],
            "volumes": [
              {
                "name": "config",
