{
  "apiVersion": "v1",
  "kind": "List",
  "items": [
    {
      "apiVersion": "v1",
      "kind": "Namespace",
      "metadata": {
        "name": "atlas"
      }
    },
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "etcd",
        "namespace": "atlas"
      },
      "spec": {
        "selector": {
          "app": "etcd"
        },
        "ports": [
          {
            "port": 2379,
            "targetPort": 2379,
            "name": "http"
          }
        ],
        "clusterIP": "None",
        "publishNotReadyAddresses": true
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "StatefulSet",
      "metadata": {
        "name": "etcd",
        "namespace": "atlas"
      },
      "spec": {
        "serviceName": "etcd",
        "replicas": 3,
        "podManagementPolicy": "Parallel",
        "selector": {
          "matchLabels": {
            "app": "etcd"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app": "etcd"
            }
          },
          "spec": {
            "containers": [
              {
                "name": "etcd",
                "image": "quay.io/coreos/etcd:v3.5.17",
                "imagePullPolicy": "IfNotPresent",
                "ports": [
                  {
                    "containerPort": 2379
                  },
                  {
                    "containerPort": 2380
                  }
                ],
                "command": [
                  "/usr/local/bin/etcd"
                ],
                "args": [
                  "--name=$(POD_NAME)",
                  "--data-dir=/etcd-data",
                  "--listen-client-urls=http://0.0.0.0:2379",
                  "--advertise-client-urls=http://$(POD_NAME).etcd:2379",
                  "--listen-peer-urls=http://0.0.0.0:2380",
                  "--initial-advertise-peer-urls=http://$(POD_NAME).etcd:2380",
                  "--initial-cluster=etcd-0=http://etcd-0.etcd:2380,etcd-1=http://etcd-1.etcd:2380,etcd-2=http://etcd-2.etcd:2380",
                  "--initial-cluster-token=atlas-kubernetes",
                  "--initial-cluster-state=new",
                  "--max-txn-ops=4096",
                  "--max-request-bytes=8388608"
                ],
                "volumeMounts": [
                  {
                    "name": "data",
                    "mountPath": "/etcd-data"
                  }
                ],
                "resources": {
                  "requests": {
                    "cpu": "50m",
                    "memory": "96Mi"
                  },
                  "limits": {
                    "cpu": "1000m",
                    "memory": "512Mi"
                  }
                },
                "env": [
                  {
                    "name": "POD_NAME",
                    "valueFrom": {
                      "fieldRef": {
                        "fieldPath": "metadata.name"
                      }
                    }
                  }
                ],
                "livenessProbe": {
                  "exec": {
                    "command": [
                      "/usr/local/bin/etcdctl",
                      "--endpoints=http://localhost:2379",
                      "endpoint",
                      "health"
                    ]
                  },
                  "initialDelaySeconds": 20,
                  "periodSeconds": 10,
                  "timeoutSeconds": 5,
                  "failureThreshold": 6
                },
                "readinessProbe": {
                  "exec": {
                    "command": [
                      "/usr/local/bin/etcdctl",
                      "--endpoints=http://localhost:2379",
                      "endpoint",
                      "health"
                    ]
                  },
                  "initialDelaySeconds": 20,
                  "periodSeconds": 10,
                  "timeoutSeconds": 5,
                  "failureThreshold": 6
                }
              }
            ]
          }
        },
        "volumeClaimTemplates": [
          {
            "metadata": {
              "name": "data"
            },
            "spec": {
              "accessModes": [
                "ReadWriteOnce"
              ],
              "resources": {
                "requests": {
                  "storage": "2Gi"
                }
              }
            }
          }
        ]
      }
    },
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "storage",
        "namespace": "atlas"
      },
      "spec": {
        "selector": {
          "app": "storage"
        },
        "ports": [
          {
            "port": 8000,
            "targetPort": 8000,
            "name": "http"
          }
        ],
        "clusterIP": "None",
        "publishNotReadyAddresses": true
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "StatefulSet",
      "metadata": {
        "name": "storage",
        "namespace": "atlas"
      },
      "spec": {
        "serviceName": "storage",
        "replicas": 8,
        "podManagementPolicy": "Parallel",
        "selector": {
          "matchLabels": {
            "app": "storage"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app": "storage"
            }
          },
          "spec": {
            "containers": [
              {
                "name": "storage",
                "image": "distributed-framework:storage",
                "imagePullPolicy": "IfNotPresent",
                "ports": [
                  {
                    "containerPort": 8000
                  }
                ],
                "envFrom": [
                  {
                    "secretRef": {
                      "name": "atlas-secrets"
                    }
                  }
                ],
                "env": [
                  {
                    "name": "ETCD_ENDPOINTS",
                    "value": "http://etcd-0.etcd:2379,http://etcd-1.etcd:2379,http://etcd-2.etcd:2379"
                  },
                  {
                    "name": "ELASTIC_URL",
                    "value": "http://elasticsearch:9200"
                  },
                  {
                    "name": "RABBITMQ_URL",
                    "value": "amqp://storage:$(RABBIT_PASSWORD)@rabbit:5672/%2F"
                  },
                  {
                    "name": "FAILURE_TIMEOUT",
                    "value": "20"
                  },
                  {
                    "name": "SCRUB_INTERVAL",
                    "value": "60"
                  },
                  {
                    "name": "NODE_ID",
                    "valueFrom": {
                      "fieldRef": {
                        "fieldPath": "metadata.name"
                      }
                    }
                  },
                  {
                    "name": "NODE_URL",
                    "value": "http://$(NODE_ID).storage:8000"
                  },
                  {
                    "name": "METADATA_URL",
                    "value": "http://metadata:8000"
                  },
                  {
                    "name": "DATA_DIR",
                    "value": "/data/chunks"
                  }
                ],
                "volumeMounts": [
                  {
                    "name": "data",
                    "mountPath": "/data"
                  }
                ],
                "resources": {
                  "requests": {
                    "cpu": "50m",
                    "memory": "96Mi"
                  },
                  "limits": {
                    "cpu": "1000m",
                    "memory": "512Mi"
                  }
                },
                "livenessProbe": {
                  "httpGet": {
                    "path": "/health",
                    "port": 8000
                  },
                  "initialDelaySeconds": 20,
                  "periodSeconds": 10
                },
                "readinessProbe": {
                  "httpGet": {
                    "path": "/health",
                    "port": 8000
                  },
                  "initialDelaySeconds": 5,
                  "periodSeconds": 5
                }
              }
            ]
          }
        },
        "volumeClaimTemplates": [
          {
            "metadata": {
              "name": "data"
            },
            "spec": {
              "accessModes": [
                "ReadWriteOnce"
              ],
              "resources": {
                "requests": {
                  "storage": "10Gi"
                }
              }
            }
          }
        ]
      }
    },
    {
      "apiVersion": "v1",
