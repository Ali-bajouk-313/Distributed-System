    {
      "apiVersion": "v1",
      "kind": "ConfigMap",
      "metadata": {
        "name": "prometheus-config",
        "namespace": "atlas"
      },
      "data": {
        "prometheus.yml": "global:\n  scrape_interval: 10s\nscrape_configs:\n  - job_name: gateway\n    kubernetes_sd_configs:\n      - role: pod\n        namespaces: {names: [atlas]}\n    relabel_configs:\n      - source_labels: [__meta_kubernetes_pod_label_app]\n        action: keep\n        regex: gateway|storage|metadata\n      - source_labels: [__meta_kubernetes_pod_ip]\n        target_label: __address__\n        replacement: '$1:8000'\n"
      }
    },
    {
      "apiVersion": "v1",
      "kind": "ServiceAccount",
      "metadata": {
        "name": "prometheus",
        "namespace": "atlas"
      }
    },
    {
      "apiVersion": "rbac.authorization.k8s.io/v1",
      "kind": "Role",
      "metadata": {
        "name": "prometheus",
        "namespace": "atlas"
      },
      "rules": [
        {
          "apiGroups": [
            ""
          ],
          "resources": [
            "pods"
          ],
          "verbs": [
