        },
        "minReplicas": 2,
        "maxReplicas": 6,
        "metrics": [
          {
            "type": "Resource",
            "resource": {
              "name": "cpu",
              "target": {
                "type": "Utilization",
                "averageUtilization": 65
              }
            }
          }
        ]
