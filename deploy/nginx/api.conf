events { worker_connections 2048; }
http {
    resolver 127.0.0.11 valid=5s ipv6=off;
    upstream gateways {
        zone gateways 64k;
        server gateway1:8000 resolve max_fails=1 fail_timeout=5s;
        server gateway2:8000 resolve max_fails=1 fail_timeout=5s;
    }
    upstream metadata_servers {
        zone metadata_servers 64k;
        server metadata:8000 resolve max_fails=1 fail_timeout=5s;
        server metadata2:8000 resolve max_fails=1 fail_timeout=5s;
    }
    server {
        listen 80;
        client_max_body_size 2g;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_request_buffering off;
        proxy_buffering off;
        location /internal/ {
            proxy_set_header X-Real-IP $remote_addr;
            proxy_pass http://metadata_servers/;
        }
        location / {
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_pass http://gateways;
        }
    }
}
