{
  "name": "distributed",
  "services": {
    "etcd1": {
      "image": "quay.io/coreos/etcd:v3.5.17",
      "restart": "unless-stopped",
      "networks": [
        "distributed"
      ],
      "command": [
        "/usr/local/bin/etcd",
        "--name",
        "etcd1"
        "--data-dir",
        "/etcd-data",
        "--listen-client-urls",
        "http://0.0.0.0:2379",
        "--advertise-client-urls",
        "http://etcd1:2379",
        "--listen-peer-urls",
        "http://0.0.0.0:2380",
        "--initial-advertise-peer-urls",
        "http://etcd1:2380",
        "--initial-cluster",
        "etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380",
        "--initial-cluster-token",
        "distributed-framework",
        "--initial-cluster-state",
        "new",
        "--max-txn-ops",
        "4096",
        "--max-request-bytes",
        "8388608"
      ],
      "volumes": [
        "etcd1-data:/etcd-data"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "/usr/local/bin/etcdctl",
          "--endpoints=http://localhost:2379",
          "endpoint",
          "health"
        ],
        "interval": "10s",
        "timeout": "5s",
        "retries": 12
      }
    },
    "etcd2": {
      "image": "quay.io/coreos/etcd:v3.5.17",
      "restart": "unless-stopped",
      "networks": [
        "distributed"
      ],
      "command": [
        "/usr/local/bin/etcd",
        "--name",
        "etcd2",
        "--data-dir",
        "/etcd-data",
        "--listen-client-urls",
        "http://0.0.0.0:2379",
        "--advertise-client-urls",
        "http://etcd2:2379",
        "--listen-peer-urls",
        "http://0.0.0.0:2380",
        "--initial-advertise-peer-urls",
        "http://etcd2:2380",
        "--initial-cluster",
        "etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380",
        "--initial-cluster-token",
        "distributed-framework",
        "--initial-cluster-state",
        "new",
        "--max-txn-ops",
        "4096",
        "--max-request-bytes",
        "8388608"
      ],
      "volumes": [
        "etcd2-data:/etcd-data"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "/usr/local/bin/etcdctl",
          "--endpoints=http://localhost:2379",
          "endpoint",
          "health"
        ],
        "interval": "10s",
        "timeout": "5s",
        "retries": 12
      }
    },
    "etcd3": {
      "image": "quay.io/coreos/etcd:v3.5.17",
      "restart": "unless-stopped",
      "networks": [
        "distributed"
      ],
      "command": [
        "/usr/local/bin/etcd",
        "--name",
        "etcd3",
        "--data-dir",
        "/etcd-data",
        "--listen-client-urls",
        "http://0.0.0.0:2379",
        "--advertise-client-urls",
        "http://etcd3:2379",
        "--listen-peer-urls",
        "http://0.0.0.0:2380",
        "--initial-advertise-peer-urls",
        "http://etcd3:2380",
        "--initial-cluster",
        "etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380",
        "--initial-cluster-token",
        "distributed-framework",
        "--initial-cluster-state",
        "new",
        "--max-txn-ops",
        "4096",
        "--max-request-bytes",
        "8388608"
      ],
      "volumes": [
        "etcd3-data:/etcd-data"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "/usr/local/bin/etcdctl",
          "--endpoints=http://localhost:2379",
          "endpoint",
          "health"
        ],
        "interval": "10s",
        "timeout": "5s",
        "retries": 12
      }
    },
    "rabbit": {
      "image": "rabbitmq:4-management",
      "restart": "unless-stopped",
      "networks": [
        "distributed"
      ],
      "environment": {
        "RABBITMQ_DEFAULT_USER": "storage",
        "RABBITMQ_DEFAULT_PASS": "${RABBIT_PASSWORD}",
        "RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS": "+S 2:2 +A 4",
        "RABBITMQ_CTL_ERL_ARGS": "+S 1:1 +A 1"
      },
      "ports": [
        "127.0.0.1:15673:15672"
      ],
      "volumes": [
        "rabbit-data:/var/lib/rabbitmq"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "rabbitmq-diagnostics",
          "-q",
          "ping"
        ],
        "interval": "15s",
        "timeout": "20s",
        "retries": 12
      }
    },
    "elasticsearch": {
      "image": "docker.elastic.co/elasticsearch/elasticsearch:8.15.0",
      "restart": "unless-stopped",
      "networks": [
        "distributed"
      ],
      "init": true,
      "entrypoint": [
        "/usr/share/elasticsearch/bin/elasticsearch"
      ],
      "command": [
        "-Ediscovery.type=single-node",
        "-Expack.security.enabled=false",
        "-Expack.ml.enabled=false",
        "-Enetwork.host=0.0.0.0"
      ],
      "environment": {
        "discovery.type": "single-node",
        "xpack.security.enabled": "false",
        "ES_JAVA_OPTS": "-Xms384m -Xmx384m",
        "xpack.ml.enabled": "false"
      },
      "mem_limit": "1g",
      "volumes": [
        "elastic-data:/usr/share/elasticsearch/data"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "curl -fsS http://localhost:9200/_cluster/health >/dev/null"
        ],
        "interval": "10s",
        "timeout": "5s",
        "retries": 24
      }
    },
    "metadata": {
      "image": "distributed-framework:metadata",
      "restart": "unless-stopped",
      "networks": [
        "distributed"
      ],
      "build": {
        "context": ".",
        "dockerfile": "docker/Dockerfile.metadata"
      },
      "environment": {
        "API_KEY": "${API_KEY:?Run scripts/setup.ps1 first}",
        "INTERNAL_KEY": "${INTERNAL_KEY:?Run scripts/setup.ps1 first}",
        "ETCD_ENDPOINTS": "http://etcd1:2379,http://etcd2:2379,http://etcd3:2379",
        "RABBITMQ_URL": "amqp://storage:${RABBIT_PASSWORD}@rabbit:5672/%2F",
        "ELASTIC_URL": "http://elasticsearch:9200",
        "FAILURE_TIMEOUT": "20",
        "SCRUB_INTERVAL": "60",
        "RATE_LIMIT": "6000"
      },
      "depends_on": {
        "etcd1": {
          "condition": "service_healthy"
        },
        "etcd2": {
          "condition": "service_healthy"
        },
        "etcd3": {
          "condition": "service_healthy"
        },
        "rabbit": {
          "condition": "service_healthy"
        }
      },
      "healthcheck": {
        "test": [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health',timeout=3)"
        ],
        "interval": "10s",
        "timeout": "5s",
        "retries": 12
      }
    },
