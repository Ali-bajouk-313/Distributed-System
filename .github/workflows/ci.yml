name: Verify storage framework
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated lab credentials
        run: |
          echo 'API_KEY=github-ci-api-key' > .env
          echo "INTERNAL_KEY=$(openssl rand -hex 32)" >> .env
          echo "RABBIT_PASSWORD=$(openssl rand -hex 16)" >> .env
          echo "GRAFANA_PASSWORD=$(openssl rand -hex 16)" >> .env
          docker network create distributed-net
          touch .local-ca.pem
      - name: Build runtime and service images
        run: |
          docker build -f docker/Dockerfile.base -t distributed-framework:base .
          docker compose build
      - name: Start cluster
        run: docker compose up -d --wait --wait-timeout 300
      - name: API, coding, range and concurrency tests
        run: docker compose exec -T gateway1 pytest tests/test_api_v2.py -v --junitxml=/tmp/api-results.xml
      - name: Seed UI and compare both workloads
        run: |
          docker compose exec -T gateway1 python scripts/seed_demo.py
          docker compose exec -T gateway1 python scripts/benchmark.py --profile smoke
      - name: Failure and recovery demonstration
        run: |
          pip install requests
          python scripts/verify_cluster.py
      - name: Collect evidence
        if: always()
        run: |
          mkdir -p artifacts
          docker compose logs --no-color > artifacts/compose.log
          docker compose cp gateway1:/tmp/api-results.xml artifacts/api-results.xml || true
          docker compose cp gateway1:/tmp/benchmark-results.json artifacts/benchmark-results.json || true
          cp docs/fault-verification.json artifacts/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storage-verification
          path: artifacts/
      - name: Stop test deployment
        if: always()
        run: docker compose --profile scale down
